name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PROJECT: Youtube_Phantom_clone.xcodeproj
      SCHEME: Youtube_Phantom_clone
      DERIVED_DATA: ${{ runner.temp }}/DerivedData
      SOURCE_PACKAGES: ${{ runner.temp }}/SourcePackages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode and project files
        run: |
          xcodebuild -version
          test -d "$PROJECT"
          test -f "$PROJECT/project.pbxproj"

      - name: Clear transient build and package state
        run: |
          rm -rf "$DERIVED_DATA" "$SOURCE_PACKAGES" "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa"

      - name: Resolve Swift package dependencies
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            -resolvePackageDependencies

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP="$DERIVED_DATA/Build/Products/Release-iphoneos/Youtube_Phantom_clone.app"
          test -d "$APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$GITHUB_WORKSPACE/Youtube-Phantom-Clone.ipa"
          test -f "$GITHUB_WORKSPACE/Youtube-Phantom-Clone.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Youtube-Phantom-Clone-unsigned-IPA
          path: Youtube-Phantom-Clone.ipa
          if-no-files-found: error
          retention-days: 7
